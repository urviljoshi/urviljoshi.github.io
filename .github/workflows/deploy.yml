name: Deploy site

# Builds the Astro site and publishes it to GitHub Pages (urvil.dev).
# Runs on every push to main, every morning so new Medium posts and
# YouTube videos appear without a commit, and on demand.

on:
  push:
    branches: [main]
  schedule:
    # 04:00 IST every day. Cron is always UTC: 04:00 IST = 22:30 UTC the day before.
    # Fields: minute hour day-of-month month day-of-week
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one that is already publishing
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Pull the latest posts and videos and mirror thumbnails. If a feed is
      # down, the committed data/feeds.json is used, so this never blocks a deploy.
      - name: Refresh Medium and YouTube feeds
        run: node scripts/fetch-feeds.mjs
        continue-on-error: true

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
